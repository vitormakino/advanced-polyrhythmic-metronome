<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="#09090b"/>
  
  <!-- Outer concentric rings -->
  <circle cx="256" cy="256" r="180" stroke="#27272a" stroke-width="2" fill="none" />
  <circle cx="256" cy="256" r="140" stroke="#27272a" stroke-width="2" fill="none" />
  <circle cx="256" cy="256" r="100" stroke="#27272a" stroke-width="2" fill="none" />
  
  <!-- Pulse Indicators -->
  <!-- Pulse 1: Amber -->
  <circle cx="256" cy="76" r="14" fill="#f59e0b" filter="url(#glow)" />
  <path d="M256 186 A 70 70 0 0 1 316 221" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3" />
  
  <!-- Pulse 2: Emerald -->
  <circle cx="116" cy="256" r="12" fill="#10b981" filter="url(#glow)" />
  <path d="M116 256 A 140 140 0 0 1 256 116" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3" />
  
  <!-- Pulse 3: Blue -->
  <circle cx="356" cy="256" r="10" fill="#3b82f6" filter="url(#glow)" />
  <path d="M256 356 A 100 100 0 0 0 356 256" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3" />
  
  <!-- Center Core -->
  <circle cx="256" cy="256" r="30" fill="#ffffff" opacity="0.05" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
  <path d="M256 256 L 256 120" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
</svg>
